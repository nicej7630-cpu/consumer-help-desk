<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Admin — Consumer Help Desk</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',Arial,sans-serif;color:#1F2937;background:#F8FAFC;line-height:1.6}
header{background:#0F3D5E;color:#fff;padding:1rem 1.25rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.brand{font-weight:800;font-size:1.05rem}
nav a{color:#CFE3F3;text-decoration:none;margin-left:1rem;font-size:.9rem}
nav a:hover{color:#fff}
.hero{background:linear-gradient(135deg,#0F3D5E,#1D6FA3);color:#fff;padding:3.5rem 1.25rem;text-align:center}
.hero h1{font-size:2rem;font-weight:800;margin-bottom:.6rem}
.hero p{max-width:620px;margin:0 auto 1.6rem;opacity:.92}
.btn{display:inline-block;background:#FFB020;color:#1F2937;padding:.85rem 1.4rem;border-radius:10px;font-weight:700;text-decoration:none;margin:.3rem}
.btn.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.6)}
main{max-width:980px;margin:0 auto;padding:2.5rem 1.25rem}
h2{font-size:1.4rem;color:#0F3D5E;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem;margin-bottom:2.5rem}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:1.2rem;box-shadow:0 6px 18px rgba(15,61,94,.06)}
.card h3{font-size:1rem;color:#0F3D5E;margin-bottom:.4rem}
.card p{font-size:.9rem;color:#4B5563}
.notice{background:#FFF7E6;border:1px solid #F5D08A;border-radius:12px;padding:1rem;font-size:.9rem;margin-bottom:2rem}
footer{background:#0F3D5E;color:#CFE3F3;text-align:center;padding:1.5rem 1rem;font-size:.82rem}
footer a{color:#fff}

.wrap{max-width:980px;margin:0 auto;padding:1.5rem 1.25rem}
.login{max-width:380px;margin:3rem auto;background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:1.5rem;box-shadow:0 6px 18px rgba(15,61,94,.06)}
label{display:block;font-weight:700;color:#0F3D5E;font-size:.88rem;margin:.8rem 0 .3rem}
input,select,textarea{width:100%;padding:.65rem .8rem;border:1px solid #CBD5E1;border-radius:10px;font:inherit;background:#fff}
button{background:#0F3D5E;color:#fff;border:0;padding:.7rem 1rem;border-radius:9px;font-weight:700;cursor:pointer;font:inherit;font-size:.88rem}
button.ghost{background:#fff;color:#0F3D5E;border:1px solid #CBD5E1}
button.ok{background:#047857}
button.no{background:#B91C1C}
.item{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:1rem 1.1rem;margin-bottom:.8rem}
.item h3{font-size:1rem;color:#0F3D5E;margin-bottom:.3rem}
.meta{font-size:.8rem;color:#6B7280;margin-bottom:.5rem}
.pill{display:inline-block;padding:.15rem .6rem;border-radius:999px;font-size:.75rem;font-weight:700;background:#E0F2FE;color:#075985;margin-left:.4rem}
.pill.res{background:#ECFDF5;color:#065F46}.pill.rev{background:#FFF7E6;color:#92400E}
.tabs{display:flex;gap:.5rem;margin:1rem 0;flex-wrap:wrap}
.tabs button{background:#fff;color:#0F3D5E;border:1px solid #CBD5E1}
.tabs button.on{background:#0F3D5E;color:#fff}
.err{background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;padding:.7rem;border-radius:9px;margin-top:.8rem;font-size:.88rem;display:none}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;align-items:center}
.body{white-space:pre-wrap;font-size:.92rem;margin:.4rem 0}

.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;padding:1rem;overflow:auto}
.modal.open{display:block}
.mbox{background:#fff;max-width:720px;margin:2rem auto;border-radius:12px;padding:1.2rem;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox .tools{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
.mbox select{width:auto;padding:.5rem}
.preview{border:1px solid #E2E8F0;border-radius:8px;overflow:hidden;background:#F4F6F8}
</style>
</head>
<body>
<header><div class="brand">Consumer Help Desk · Admin</div><nav><button class="ghost" id="logoutBtn" style="display:none" onclick="doLogout()">Sign out</button></nav></header>

<div id="loginView" class="login">
  <h2 style="color:#0F3D5E;margin-bottom:.4rem">Admin sign-in</h2>
  <p style="font-size:.88rem;color:#4B5563">Private area. Only the Help Desk administrator can sign in.</p>
  <label for="em">Email</label><input id="em" type="email" value="consumercen.us@gmail.com"/>
  <label for="pw">Password</label><input id="pw" type="password"/>
  <button style="width:100%;margin-top:1rem" onclick="signIn()">Sign in</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="replyModal" class="modal">
  <div class="mbox">
    <div class="tools">
      <strong style="color:#0F3D5E;margin-right:auto">Reply to complainant</strong>
      <select id="tplPick" onchange="renderReply()">
        <option value="received">Complaint received</option>
        <option value="info">More information needed</option>
        <option value="update">Update on your complaint</option>
        <option value="demand">Demand: return of payment (to the business)</option>
        <option value="consent">Ask permission before we contact the business</option>
        <option value="evidence">Ask for evidence</option>
        <option value="dispute">Ask your bank to dispute the payment</option>
        <option value="platform">Report to the platform</option>
        <option value="closed">Complaint closed</option>
        <option value="scam1">Scam: 1 · Act now (day 1)</option>
        <option value="scam2">Scam: 2 · How to report (day 2)</option>
        <option value="scam3">Scam: 3 · Beware of recovery scams (day 4)</option>
        <option value="scam4">Scam: 4 · Protect your accounts (day 7)</option>
        <option value="scam5">Scam: 5 · Next steps and support (day 14)</option>
      </select>
      <button class="ok" onclick="copyReply()">Copy formatted email</button>
      <button class="ghost" onclick="closeReply()">Close</button>
    </div>
    <div class="meta" id="replyTo" style="font-size:.82rem;color:#6B7280;margin-bottom:.6rem"></div>
    <div class="preview" id="replyPreview"></div>
    <p style="font-size:.8rem;color:#6B7280;margin-top:.6rem">Copy, then paste into Gmail. The formatting, header and layout are kept.</p>
  </div>
</div>
<div id="appView" class="wrap" style="display:none">
  <div class="tabs">
    <button id="tabC" class="on" onclick="showTab('complaints')">Complaints</button>
    <button id="tabT" onclick="showTab('testimonies')">Testimonies</button>
    <button class="ghost" onclick="loadAll()">Refresh</button>
  </div>
  <div id="complaintsList"></div>
  <div id="testimoniesList" style="display:none"></div>
</div>

<script type="module">
import { adminSignIn, adminSignOut, onAdminChange, listComplaints, updateComplaint, listAllTestimonies, approveTestimony, ADMIN_EMAIL } from './consumer-db.js';

const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => t && t.toDate ? t.toDate().toLocaleString('en-GB') : (t || '');

window.signIn = async function(){
  const err = document.getElementById('loginErr');
  err.style.display = 'none';
  try{
    await adminSignIn(document.getElementById('em').value.trim(), document.getElementById('pw').value);
  }catch(e){
    err.textContent = 'Sign-in failed. Check the email and password. (' + (e.code || e.message) + ')';
    err.style.display = 'block';
  }
};

window.doLogout = async function(){ await adminSignOut(); };

function showTab(name){
  const c = name === 'complaints';
  document.getElementById('complaintsList').style.display = c ? 'block' : 'none';
  document.getElementById('testimoniesList').style.display = c ? 'none' : 'block';
  document.getElementById('tabC').className = c ? 'on' : '';
  document.getElementById('tabT').className = c ? '' : 'on';
}
window.showTab = showTab;

async function loadComplaints(){
  const box = document.getElementById('complaintsList');
  box.innerHTML = 'Loading complaints...';
  try{
    const list = await listComplaints();
    window._complaints = list;
    box.innerHTML = list.length ? list.map(c => `
      <div class="item">
        <h3>${esc(c.business)} <span class="pill ${c.status==='Resolved'?'res':c.status==='In review'?'rev':''}">${esc(c.status)}</span></h3>
        <div class="meta">Ref ${esc(c.id)} · from ${esc(c.name)} &lt;${esc(c.email)}&gt; · ${esc(fmt(c.createdAt))}</div>
        <div class="meta">Date of problem: ${esc(c.incidentDate)} · Amount: ${esc(c.amount || '—')} · Paid by: ${esc(c.paymentMethod)} · Order: ${esc(c.orderNumber || '—')}</div>
        <div class="body">${esc(c.description)}</div>
        <div class="row">
          <button class="ghost" onclick="setStatus('${esc(c.id)}','In review')">Mark in review</button>
          <button class="ok" onclick="setStatus('${esc(c.id)}','Resolved')">Mark resolved</button>
          <button class="ghost" onclick="openReply('${esc(c.id)}')">✉ Reply</button>
        </div>
      </div>`).join('') : '<div class="item">No complaints yet.</div>';
  }catch(e){
    box.innerHTML = '<div class="err" style="display:block">Could not load complaints: ' + esc(e.code || e.message) + '</div>';
  }
}

async function loadTestimonies(){
  const box = document.getElementById('testimoniesList');
  box.innerHTML = 'Loading testimonies...';
  try{
    const list = await listAllTestimonies();
    box.innerHTML = list.length ? list.map(t => `
      <div class="item">
        <h3>${esc(t.name || 'Anonymous')} ${t.country ? '· ' + esc(t.country) : ''} <span class="pill ${t.approved?'res':'rev'}">${t.approved ? 'Shown on website' : 'Waiting for approval'}</span></h3>
        <div class="meta">${esc(fmt(t.createdAt))}</div>
        <div class="body">${esc(t.story)}</div>
        <div class="row">
          ${t.approved
            ? `<button class="no" onclick="setApproval('${esc(t.id)}',false)">Hide from website</button>`
            : `<button class="ok" onclick="setApproval('${esc(t.id)}',true)">Approve and show</button>`}
        </div>
      </div>`).join('') : '<div class="item">No testimonies yet.</div>';
  }catch(e){
    box.innerHTML = '<div class="err" style="display:block">Could not load testimonies: ' + esc(e.code || e.message) + '</div>';
  }
}

async function loadAll(){ await loadComplaints(); await loadTestimonies(); }

window.setStatus = async function(id, status){
  try{ await updateComplaint(id, { status }); await loadComplaints(); }
  catch(e){ alert('Could not update: ' + (e.code || e.message)); }
};

window.setApproval = async function(id, approved){
  try{ await approveTestimony(id, approved); await loadTestimonies(); }
  catch(e){ alert('Could not update: ' + (e.code || e.message)); }
};

onAdminChange(user => {
  const signedIn = !!user && user.email === ADMIN_EMAIL;
  document.getElementById('loginView').style.display = signedIn ? 'none' : 'block';
  document.getElementById('appView').style.display = signedIn ? 'block' : 'none';
  document.getElementById('logoutBtn').style.display = signedIn ? 'inline-block' : 'none';
  if(signedIn) loadAll();
});
</script>

<script>
/* ---- Reply emails, designed as a newsletter-style update ---- */
let _replyC = null;
const TPL = {
  received: {
    subject: 'We have received your complaint',
    title: 'Your complaint has been received',
    body: n => `Dear ${n.name},<br/><br/>Thank you for contacting the Consumer Help Desk. We have received your complaint about <strong>${n.business}</strong> and it is now with our team.<br/><br/>We aim to reply within 10 working days. If we need anything more from you, we will email you.`
  },
  info: {
    subject: 'We need some more information',
    title: 'A little more information, please',
    body: n => `Dear ${n.name},<br/><br/>Thank you for your complaint about <strong>${n.business}</strong>. To help us move forward, please reply to this email with:<br/><ul style="margin:.6rem 0 .6rem 1.2rem"><li>Any order or reference number</li><li>Copies of receipts, messages or screenshots</li><li>What you have already asked the business to do</li></ul>Please don't send passwords, one-time codes or full card numbers.`
  },
  scam1: {
    subject: 'Step 1 of 5: act now to protect your money',
    title: 'Step 1: act now to protect your money',
    color: '#991B1B',
    body: n => `Dear ${n.name},<br/><br/><strong>We are sorry this has happened to you.</strong> Scammers rely on panic, so please act now, in this order:<br/>
<ol style="margin:.6rem 0 .6rem 1.3rem">
<li><strong>Contact your bank or card provider immediately.</strong> Use the number on your card or the official website, not a number from the scammer. Ask them to stop or recall the payment, and to block the card if needed.</li>
<li><strong>Stop contact with the scammer.</strong> Don't reply, click links, install apps, or share codes, passwords or screen access.</li>
<li><strong>Keep the evidence.</strong> Save messages, emails, phone numbers, account details, receipts and screenshots. Don't delete anything.</li>
</ol>
Over the next few days we will send you the next steps, one at a time.`
  },
  scam2: {
    subject: 'Step 2 of 5: how to report the scam',
    title: 'Step 2: report the scam',
    color: '#9A3412',
    body: n => `Dear ${n.name},<br/><br/>Reporting the scam helps the authorities track these criminals, and it can help you get your money back.<br/><br/>Please report it to:
<ul style="margin:.6rem 0 .6rem 1.2rem"><li>The <strong>police</strong> in your area</li><li>Your <strong>national consumer authority</strong>, or the online crime reporting service in your country</li><li>Your <strong>bank or card provider</strong>, if you haven't already</li></ul>
When you report, have ready: the date and time, the amount, how you paid, the scammer's contact details, and the messages or screenshots you saved. <strong>Keep any crime or report reference number you are given.</strong>`
  },
  scam3: {
    subject: 'Step 3 of 5: beware of recovery scams',
    title: 'Step 3: beware of recovery scams',
    color: '#7C2D12',
    body: n => `Dear ${n.name},<br/><br/><strong>After a scam, many victims are contacted again</strong> by people offering to recover the money, often for a fee. This is almost always a second scam.<br/><br/>Please remember:
<ul style="margin:.6rem 0 .6rem 1.2rem"><li><strong>Never pay a fee</strong> to get your money back.</li><li>Be wary of anyone who contacts you first, even if they claim to be a lawyer, bank, police officer or government office.</li><li>Genuine authorities and banks will never ask you to pay a fee, or to pay in gift cards, crypto or by bank transfer, to recover money.</li></ul>
If you're unsure whether a contact is genuine, end the call and check with your bank or the authority directly, using the number on their official website.`
  },
  scam4: {
    subject: 'Step 4 of 5: protect your accounts and identity',
    title: 'Step 4: protect your accounts',
    color: '#92400E',
    body: n => `Dear ${n.name},<br/><br/>Scammers often try again, or use your details elsewhere. Please take these steps this week:
<ul style="margin:.6rem 0 .6rem 1.2rem"><li><strong>Change the passwords</strong> for your email, banking and shopping accounts, and use a different password for each.</li><li><strong>Turn on two-step verification</strong> wherever it's offered.</li><li><strong>Check your statements</strong> each week, and tell your bank straight away about anything you don't recognise.</li><li><strong>Watch for follow-up messages</strong>, especially ones that mention your scam.</li><li>If you think your identity has been used, ask your national authority or credit reference service about protecting your records.</li></ul>`
  },
  scam5: {
    subject: 'Step 5 of 5: your next steps and our support',
    title: 'Step 5: your next steps and our support',
    color: '#065F46',
    body: n => `Dear ${n.name},<br/><br/>Thank you for trusting the Consumer Help Desk with your complaint. We hope the steps we have shared are helping you move forward.<br/><br/>
<strong>What we can do:</strong> explain your rights, help you understand your options, and reply to your questions.<br/>
<strong>What we cannot do:</strong> guarantee that money will be recovered, or act for you against a bank or police.<br/><br/>
If you'd like to share what happened, to warn others, you're welcome to do so on our website, but only with your agreement, and we will never publish your details without asking first.<br/><br/>
If you have questions, reply to this email. We are here to help.`
  },
  demand: {
    subject: 'Formal demand for return of payment, reference ${n.ref}',
    title: 'Formal demand for return of payment',
    color: '#7F1D1D',
    body: n => `To ${n.business},<br/><br/>We write on behalf of <strong>${n.name}</strong> regarding the payment of <strong>${n.amount}</strong> made on <strong>${n.date}</strong>, reference <strong>${n.ref}</strong>.<br/><br/>${n.name} has not received the goods or service as agreed, or the goods received are not as described.<br/><br/>We therefore require you to do one of the following <strong>within 14 days</strong>:<br/>
<ol style="margin:.6rem 0 .6rem 1.3rem"><li>Return the full amount of ${n.amount} to ${n.name}; or</li><li>Deliver the goods or service exactly as agreed.</li></ol>
Please also confirm in writing your full name, business address and any registration details.<br/><br/>We have preserved all records, including the messages, the payment record and the listing or advertisement. If this is not resolved, these records will be provided to the police, the consumer authority in the relevant country, and the payment provider.<br/><br/>Please reply to info@consumerhelp.live quoting reference ${n.ref}. Do not make any further payment a condition of returning the money.`
  },
  consent: {
    subject: 'Your permission: may we contact the business for you?',
    title: 'Your permission is needed',
    color: '#1E40AF',
    body: n => `Dear ${n.name},<br/><br/>Thank you for your complaint about <strong>${n.business}</strong>. Before we contact them on your behalf, we need your clear permission.<br/><br/>If you agree, we will send the business a formal written demand for the return of your payment or the goods, with a 14-day deadline, and copy the records to the authorities.<br/><br/><strong>Please reply to this email with one of the following:</strong>
<ul style="margin:.6rem 0 .6rem 1.2rem"><li><strong>"Yes"</strong>, to go ahead.</li><li><strong>"No"</strong>, if you'd prefer us not to contact them.</li></ul>
We will not contact the business without your reply. You can change your mind at any time.`
  },
  evidence: {
    subject: 'What we need from you to act',
    title: 'What we need from you',
    color: '#92400E',
    body: n => `Dear ${n.name},<br/><br/>To help us act for you, please send the following, by reply to this email:
<ul style="margin:.6rem 0 .6rem 1.2rem"><li>The payment receipt, or bank or card statement line</li><li>The advert, listing or website address</li><li>All messages, emails and call details with the business or person</li><li>Screenshots that show the business name, the price and the promises made</li><li>Any order or reference number</li></ul>
<strong>Please don't send passwords, one-time codes or full card numbers.</strong> The more complete the evidence, the stronger the case.`
  },
  dispute: {
    subject: 'Next step: ask your bank to dispute the payment',
    title: 'Ask your bank to dispute the payment',
    color: '#0E7490',
    body: n => `Dear ${n.name},<br/><br/>Often the fastest way to recover money paid by card is a <strong>chargeback</strong> (also called a dispute), which your card provider can start. Time limits apply, so please act now.<br/><br/><strong>Please contact your bank or card provider today and say:</strong>
<ul style="margin:.6rem 0 .6rem 1.2rem"><li>"I want to dispute a payment of ${n.amount} made on ${n.date}, reference ${n.ref}."</li><li>"The goods or service were not provided as agreed."</li><li>"I have evidence, including messages and screenshots."</li></ul>
Ask for the dispute reference number, and keep a note of the date and the name of the person you spoke to.`
  },
  platform: {
    subject: 'Report to the platform where the sale happened',
    title: 'Report to the platform',
    color: '#4338CA',
    body: n => `Dear ${n.name},<br/><br/>If the sale took place on a marketplace, social media, or a website, please report it to that platform as well. Platforms can remove listings and freeze accounts, which protects other people too.<br/><br/><strong>Please do this today:</strong>
<ul style="margin:.6rem 0 .6rem 1.2rem"><li>Use the platform's <strong>report</strong> or <strong>scam</strong> option on the listing or profile.</li><li>Save the link to the listing or profile before it's removed.</li><li>Keep the reference number the platform gives you.</li></ul>
Reply to this email with the platform name and any report reference, and we will add it to your complaint.`
  },
  closed: {
    subject: 'Your complaint has been closed',
    title: 'Your complaint has been closed',
    color: '#166534',
    body: n => `Dear ${n.name},<br/><br/>We are writing to let you know that your complaint about <strong>${n.business}</strong>, reference <strong>${n.ref}</strong>, is now closed.<br/><br/><strong>What happened:</strong> we reviewed your complaint, and the steps set out in our earlier messages were shared with you.<br/><br/>Your record is kept for <strong>24 months</strong> after closure, and then deleted, as explained in our privacy notice.<br/><br/>If anything changes, or you need further help, reply to this email, and we will reopen your complaint. Thank you for trusting the Consumer Help Desk.`
  },
  update: {
    subject: 'An update on your complaint',
    title: 'An update on your complaint',
    body: n => `Dear ${n.name},<br/><br/>We have reviewed your complaint about <strong>${n.business}</strong>. Here is what we suggest as your next step:<br/><ul style="margin:.6rem 0 .6rem 1.2rem"><li>Write to the business again, in writing, with a clear deadline.</li><li>Keep copies of everything you send and receive.</li><li>If there is no response, you can contact your bank or card provider, or the consumer authority for your country.</li></ul>Reply to this email if you have questions.`
  }
};

function openReply(id){
  _replyC = (window._complaints || []).find(c => c.id === id);
  if(!_replyC) return;
  document.getElementById('replyTo').textContent = 'To: ' + _replyC.email + '   ·   Reference: ' + _replyC.id;
  document.getElementById('replyModal').classList.add('open');
  const text = (_replyC.description || '') + ' ' + (_replyC.business || '');
  if(/scam|fraud|fake|phish|stolen|hacked|impersonat|recover/i.test(text)){ document.getElementById('tplPick').value = 'scam1'; }
  renderReply();
}
function closeReply(){ document.getElementById('replyModal').classList.remove('open'); }

function replyHtml(key){
  const t = TPL[key];
  const n = { name: _replyC.name || 'there', business: _replyC.business || 'the business',
    amount: _replyC.amount || 'the amount paid', date: _replyC.incidentDate || 'the date of payment', ref: _replyC.id };
  const when = new Date().toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});
  const band = t.color || '#0F5C8F';
  return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F4F6F8" style="background-color:#F4F6F8;font-family:Arial,Helvetica,sans-serif">
<tr><td align="center" style="padding:16px;background-color:#F4F6F8">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%">
<tr><td bgcolor="${band}" style="background-color:${band};padding:22px 24px;border-radius:8px 8px 0 0">
<img src="https://consumerhelp.live/consumer-help-desk-logo.png" width="220" height="59" alt="Consumer Help Desk" style="display:block;border:0;width:220px;height:59px"/>
<div style="font-size:22px;font-weight:bold;color:#FFFFFF;margin-top:12px;font-family:Arial,Helvetica,sans-serif">${t.title}</div>
<div style="font-size:12px;color:#E5E7EB;margin-top:6px;font-family:Arial,Helvetica,sans-serif">Complaint update · ${when} · Ref ${_replyC.id}</div>
</td></tr>
<tr><td bgcolor="#FFFFFF" style="background-color:#FFFFFF;padding:24px;font-size:15px;line-height:1.6;color:#1B1B1B;font-family:Arial,Helvetica,sans-serif">${t.body(n)}</td></tr>

function renderReply(){
  const key = document.getElementById('tplPick').value;
  document.getElementById('replyPreview').innerHTML = replyHtml(key);
}

async function copyReply(){
  const key = document.getElementById('tplPick').value;
  const html = replyHtml(key);
  const text = TPL[key].subject + '\n\n' + document.getElementById('replyPreview').innerText;
  try{
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], {type:'text/html'}),
      'text/plain': new Blob([text], {type:'text/plain'})
    })]);
    alert('Copied. Now open Gmail, click Compose, and paste (Ctrl+V or Cmd+V). Add the subject: ' + TPL[key].subject);
  }catch(e){
    alert('Could not copy automatically. Select the preview and copy it manually.');
  }
}
